name: Integrate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint

  build:
    name: ${{ matrix.host }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            host: linux-x64
          - os: ubuntu-24.04-arm
            host: linux-arm64
          - os: macos-latest
            host: darwin-arm64
          - os: macos-15-intel
            host: darwin-x64
          - os: windows-latest
            host: win32-x64
          - os: windows-11-arm
            host: win32-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Setup repo
        uses: holepunchto/actions/.github/steps/setup-repo@v1

      - name: Install w/ dev deps
        run: npm install

      - name: Install Bare Runtime
        run: npm i -g bare

      - name: Test
        run: npm test

      - name: Build Local Runtime
        run: npm run make

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ${{ matrix.host }}
          path: out/by-arch/app/${{ matrix.host }}/

  package:
    name: Package by-arch
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup repo
        uses: holepunchto/actions/.github/steps/setup-repo@v1

      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x out/darwin-*/gip out/linux-*/gip
          chmod +x out/darwin-*/git-remote-git+pear out/linux-*/git-remote-git+pear
          chmod +x out/darwin-*/git+pear out/linux-*/git+pear

          npm run release

          tar -czf release.tar.gz out/release

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes || true
            gh release upload "$GITHUB_REF_NAME" release.tar.gz --clobber
          fi
